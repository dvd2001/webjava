openapi: 3.0.3
info:
  title: Kerékpár állomás kölcsönzés API
  version: 0.2.0
  description: |
    Egy állomáshoz kötött kerékpár-kölcsönzés REST API-ja.

    **Hitelesítés:** a `POST /api/auth/login` felhasználónévvel és jelszóval rövid életű, aláírt JWT-t ad.
    Minden más végpont `Authorization: Bearer <token>` fejlécet vár. A műveletet végző felhasználót kizárólag a
    token azonosítja (a kérésből nem adható meg), a szerepkört a szerver ellenőrzi.

    **Szerepkörök:** `manager` (állomásvezető) és `renter` (bérlő).
    Az időpontok epoch ezredmásodpercek (UTC), a pénzösszegek egész forintban értendők.
servers:
  - url: http://localhost:8080
    description: Helyi fejlesztői szerver
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Bejelentkezés
  - name: Reference
    description: Felhasználók és tarifák
  - name: Bikes
    description: Biciklik
  - name: Rentals
    description: Bérlések

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Bejelentkezés felhasználónévvel és jelszóval
      description: |
        Sikeres hitelesítés után Bearer tokent ad. A hibás felhasználónévre és a hibás jelszóra ugyanaz a válasz érkezik.
        Ismételt sikertelen próbálkozás után a felhasználónév átmenetileg zárolódik (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sikeres bejelentkezés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/users:
    get:
      tags: [Reference]
      operationId: listUsers
      summary: A felhasználók listája (csak állomásvezető)
      responses:
        '200':
          description: Felhasználók
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/tariffs:
    get:
      tags: [Reference]
      operationId: listTariffs
      summary: Díjszabás biciklitípusonként
      responses:
        '200':
          description: A tarifák a biciklitípus (city, mountain, electric) szerint kulcsolva
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/Tariff'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/bikes:
    get:
      tags: [Bikes]
      operationId: listBikes
      summary: Az állomás biciklijei státusszal
      responses:
        '200':
          description: Biciklik
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bike'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Bikes]
      operationId: createBike
      summary: Új bicikli felvétele (csak állomásvezető)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBikeRequest'
      responses:
        '201':
          description: A felvett bicikli (státusza `available`)
          headers:
            Location:
              description: Az új bicikli URL-je
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bike'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/bikes/{id}/status:
    patch:
      tags: [Bikes]
      operationId: changeBikeStatus
      summary: Bicikli státuszának módosítása (csak állomásvezető)
      description: |
        Csak az `available` és a `maintenance` állítható be közvetlenül.
        Használatban lévő bicikli státusza csak visszavétellel változik, az `in_use` csak bérléssel áll elő.
      parameters:
        - $ref: '#/components/parameters/BikeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeBikeStatusRequest'
      responses:
        '200':
          description: A módosított bicikli
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bike'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/rentals:
    get:
      tags: [Rentals]
      operationId: listRentals
      summary: Bérlések (állomásvezetőnek mind, bérlőnek csak a sajátjai)
      parameters:
        - name: status
          in: query
          required: false
          description: Szűrés a bérlés állapota szerint
          schema:
            type: string
            enum: [all, active, finished]
            default: all
      responses:
        '200':
          description: Bérlések kezdési idő szerint növekvő sorrendben
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rental'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Rentals]
      operationId: createRental
      summary: Bicikli bérlése (csak bérlő)
      description: Csak `available` státuszú bicikli bérelhető, a bérelt bicikli nem adható ki újra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRentalRequest'
      responses:
        '201':
          description: A megkezdett bérlés
          headers:
            Location:
              description: Az új bérlés URL-je
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rental'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/rentals/{id}/return:
    post:
      tags: [Rentals]
      operationId: returnRental
      summary: Bicikli visszavétele és a bérleti díj kiszámítása
      description: |
        A díj a tarifából (kezdődíj + megkezdett percek × percdíj, legalább 1 perc) és a mért használati időből adódik.
        A bérlő csak a saját bérlését zárhatja le, az állomásvezető bármelyiket.
      parameters:
        - $ref: '#/components/parameters/RentalId'
      responses:
        '200':
          description: A lezárt bérlés a végső díjjal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rental'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A `POST /api/auth/login` által kiadott, rövid életű token

  parameters:
    BikeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: b3
    RentalId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: r3

  responses:
    BadRequest:
      description: Érvénytelen kérés (hibás vagy hiányzó adat, ismeretlen szűrő)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Hiányzó, érvénytelen vagy lejárt token, illetve hibás bejelentkezési adat
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: A szerepkör nem jogosult a műveletre
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Ismeretlen bicikli vagy bérlés
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Üzleti szabály vagy egyidejű módosítás miatt nem végrehajtható
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Túl sok sikertelen bejelentkezési kísérlet, később újra lehet próbálni
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    BikeType:
      type: string
      enum: [city, mountain, electric]
    BikeStatus:
      type: string
      enum: [available, in_use, maintenance]
    UserRole:
      type: string
      enum: [manager, renter]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: peter
        password:
          type: string
          format: password
          writeOnly: true

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
          description: Aláírt JWT; a `sub` claim a felhasználó azonosítója
        tokenType:
          type: string
          enum: [Bearer]
        expiresAt:
          type: integer
          format: int64
          description: A token lejárata (epoch ezredmásodperc)
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          example: u2
        name:
          type: string
          example: Nagy Péter
        role:
          $ref: '#/components/schemas/UserRole'

    Tariff:
      type: object
      required: [baseFee, perMinute]
      properties:
        baseFee:
          type: integer
          format: int64
          description: Egyszeri kezdődíj (Ft)
          example: 300
        perMinute:
          type: integer
          format: int64
          description: Percdíj (Ft) megkezdett percenként
          example: 15

    Bike:
      type: object
      required: [id, name, type, status]
      properties:
        id:
          type: string
          example: b3
        name:
          type: string
          example: City-03
        type:
          $ref: '#/components/schemas/BikeType'
        status:
          $ref: '#/components/schemas/BikeStatus'

    CreateBikeRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          description: Egyedi név (kis- és nagybetűtől függetlenül), 2-50 karakter szóközök nélkül a két végén
          example: City-03
        type:
          $ref: '#/components/schemas/BikeType'

    ChangeBikeStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/BikeStatus'

    CreateRentalRequest:
      type: object
      required: [bikeId]
      properties:
        bikeId:
          type: string
          example: b3

    Rental:
      type: object
      required: [id, bikeId, userId, startedAt, elapsedSeconds, currentFee]
      properties:
        id:
          type: string
          example: r3
        bikeId:
          type: string
          example: b3
        userId:
          type: string
          example: u2
        startedAt:
          type: integer
          format: int64
          description: A bérlés kezdete (epoch ezredmásodperc)
        endedAt:
          type: integer
          format: int64
          description: A bérlés vége; csak lezárt bérlésnél szerepel
        fee:
          type: integer
          format: int64
          description: A végső díj (Ft); csak lezárt bérlésnél szerepel
        elapsedSeconds:
          type: integer
          format: int64
          description: Az eltelt (lezárt bérlésnél a teljes) használati idő a válasz pillanatában
        currentFee:
          type: integer
          format: int64
          description: Az eddigi (lezárt bérlésnél a végső) díj a válasz pillanatában

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Géppel olvasható hibakód
          example: BIKE_NOT_AVAILABLE
        message:
          type: string
          description: Emberi olvasatra szánt, magyar nyelvű üzenet
          example: Ez a bicikli jelenleg nem bérelhető.
