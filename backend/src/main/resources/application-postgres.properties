# PostgreSQL profil: --spring.profiles.active=postgres
# A sémát a Flyway kezeli (db/migration), a Hibernate csak ellenőrzi (validate), sosem módosítja.
spring.autoconfigure.exclude=

spring.datasource.url=${KEREKPAR_DB_URL:jdbc:postgresql://localhost:5432/kerekpar}
spring.datasource.username=${KEREKPAR_DB_USER:kerekpar}
spring.datasource.password=${KEREKPAR_DB_PASSWORD:}

spring.flyway.enabled=true
# CSAK FEJLESZTÉSRE: a db/dev könyvtár ismert demo jelszavakat tölt be; élesben ezt a részt el kell hagyni
spring.flyway.locations=classpath:db/migration,classpath:db/dev
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# A példaadat fix azonosítókkal írna, ami ütközne az adatbázis azonosító-sorozataival
kerekpar.demo-data.enabled=false
