spring.application.name=kerekpar-berles-backend
server.port=8080

# A kisbetűs enum értékek ("in_use", "city") elfogadása a kérésekben
spring.jackson.mapper.accept-case-insensitive-enums=true

kerekpar.cors.allowed-origins=http://localhost:5173
kerekpar.demo-data.enabled=true

# A válaszokban nem szerepelnek a null mezők (pl. a futó bérlés endedAt/fee értéke), ahogy a szerződés opcionális mezői
spring.jackson.default-property-inclusion=non_null

# Az alapértelmezett futás in-memory: az adatbázis-autokonfigurációk ki vannak kapcsolva (a "postgres" profil bekapcsolja őket)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

logging.level.root=INFO
logging.level.hu.kerekpar=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/kerekpar-backend.log
logging.charset.file=UTF-8
logging.charset.console=UTF-8
